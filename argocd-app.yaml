apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: votescale
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/saketrama-v/VoteScale_DevOps_Learning.git'
    targetRevision: HEAD
    path: votescale-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
