# Default values for VoteScale Chart.
# These variables will be injected into our Kubernetes manifest templates.

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/saketrama-v/votescale-backend
    tag: latest
  service:
    nodePort: 30008
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/saketrama-v/votescale-frontend
    tag: latest
  service:
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50

postgres:
  storageSize: 1Gi
  dbName: votedb
  dbUser: postgres
  # Note: The database password. Helm will automatically base64 encode this in secrets.yaml!
  dbPassword: secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

ingress:
  host: votescale.local
